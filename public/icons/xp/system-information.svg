<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="si-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <linearGradient id="si-case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f9"/>
      <stop offset="0.55" stop-color="#d9dde8"/>
      <stop offset="1" stop-color="#aab1c4"/>
    </linearGradient>
    <linearGradient id="si-screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#b9e0ff"/>
      <stop offset="0.45" stop-color="#4fa3f0"/>
      <stop offset="1" stop-color="#1c5fc4"/>
    </linearGradient>
    <linearGradient id="si-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="si-stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e8ef"/>
      <stop offset="1" stop-color="#9aa2b6"/>
    </linearGradient>
    <radialGradient id="si-badge" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8ec5ff"/>
      <stop offset="0.5" stop-color="#2a7be4"/>
      <stop offset="1" stop-color="#0b3f9e"/>
    </radialGradient>
    <linearGradient id="si-badge-hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="22" cy="43.2" rx="15" ry="2.6" fill="#000" fill-opacity="0.28" filter="url(#si-shadow)"/>
  <ellipse cx="36.5" cy="38.5" rx="8" ry="7.5" fill="#000" fill-opacity="0.22" filter="url(#si-shadow)"/>

  <!-- stand -->
  <path d="M17 34h10l2.2 5.4H14.8z" fill="url(#si-stand)" stroke="#6b7389" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M11 39.2h22c.9 0 1.5.6 1.5 1.3s-.6 1.3-1.5 1.3H11c-.9 0-1.5-.6-1.5-1.3s.6-1.3 1.5-1.3z" fill="url(#si-stand)" stroke="#6b7389" stroke-width="0.8"/>

  <!-- monitor case -->
  <rect x="4.5" y="5" width="35" height="30" rx="3" fill="url(#si-case)" stroke="#6b7389" stroke-width="0.9"/>
  <path d="M7.5 6h29" stroke="#fff" stroke-opacity="0.9" stroke-width="1"/>

  <!-- screen -->
  <rect x="8" y="8.5" width="28" height="21.5" rx="1.2" fill="url(#si-screen)" stroke="#2c4f8f" stroke-width="0.8"/>
  <path d="M8.6 9.1h26.8v8.2C27 20 17 17.5 8.6 20.5z" fill="url(#si-gloss)"/>

  <!-- information rows on the screen -->
  <g fill="#fff" fill-opacity="0.85">
    <rect x="11" y="12" width="9" height="1.6" rx="0.5"/>
    <rect x="11" y="16" width="14" height="1.6" rx="0.5"/>
    <rect x="11" y="20" width="11" height="1.6" rx="0.5"/>
    <rect x="11" y="24" width="7" height="1.6" rx="0.5"/>
  </g>

  <!-- power LED -->
  <circle cx="35.5" cy="32.4" r="0.9" fill="#3fd33f" stroke="#1d7a1d" stroke-width="0.4"/>

  <!-- the "i" badge -->
  <circle cx="35.5" cy="35" r="9.2" fill="url(#si-badge)" stroke="#0a3478" stroke-width="0.9"/>
  <ellipse cx="35.5" cy="30.4" rx="6.4" ry="3.9" fill="url(#si-badge-hi)"/>
  <circle cx="35.5" cy="30.3" r="1.75" fill="#fff"/>
  <path d="M33 33.4h3.9v6.2h1.3v2h-5.4v-2h1.3v-4.2H33z" fill="#fff"/>
</svg>
